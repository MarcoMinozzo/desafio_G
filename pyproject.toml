[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getnet-assist"
version = "1.0.0"
description = "Multi-agent customer assistant for Getnet merchants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2",
  "pyyaml>=6",
  "rank-bm25>=0.2.2",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["openai>=1.40", "chromadb>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
