openapi: 3.1.0
info:
  title: Getnet Assist
  version: 1.0.0
  description: |
    Chat, the review record, the hallucination check, and the metrics snapshot.
    Chat always returns a meaningful JSON body for a well-formed request,
    including refusals and handoffs. The check read returns only the verdict.
    The metrics read returns only aggregate counts.
paths:
  /v1/chat:
    post:
      operationId: createChat
      summary: Answer one merchant message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Answer, refusal, or handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reply"
        "422":
          description: Malformed JSON or user_id that fails the pattern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/traces/{trace_id}:
    get:
      operationId: getTrace
      summary: Read one review record
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Review record without raw customer payloads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRecord"
        "404":
          description: Unknown trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/traces/{trace_id}/check:
    get:
      operationId: getTraceCheck
      summary: Read the hallucination verdict for one reply
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Verdict, confidence, and the three check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
        "404":
          description: Unknown trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/metrics:
    get:
      operationId: getMetrics
      summary: Read aggregate quality counters
      responses:
        "200":
          description: Counts, corpus age, and active alert names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSnapshot"
components:
  schemas:
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message, user_id]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        user_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        session_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
    PublicSource:
      type: object
      additionalProperties: false
      required: [title, url]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
    Handoff:
      type: object
      additionalProperties: false
      required: [reference, reason]
      properties:
        reference:
          type: string
          pattern: "^ESC-[A-Z0-9]{8}$"
        reason:
          type: string
          enum: [human_requested, low_confidence, insufficient_sources]
    Reply:
      type: object
      additionalProperties: false
      required: [trace_id, answer, route, sources, confidence, handoff, tools_used, session_id]
      properties:
        trace_id:
          type: string
          format: uuid
        answer:
          type: string
          minLength: 1
        route:
          type: array
          minItems: 1
          items:
            type: string
            enum: [guardrail, router, knowledge, support, escalation]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/PublicSource"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        handoff:
          oneOf:
            - $ref: "#/components/schemas/Handoff"
            - type: "null"
        tools_used:
          type: array
          items:
            type: string
            enum: [get_merchant_account, get_receivables, diagnose_terminal, web_search]
        session_id:
          type: string
          minLength: 1
          maxLength: 64
    ReviewRecord:
      type: object
      additionalProperties: false
      required:
        [
          trace_id,
          user_id,
          session_id,
          route,
          intent,
          tools,
          sources,
          retrieval_scores,
          outcome,
          confidence,
          handoff,
          latency_ms,
          claimed_statements,
          evidence,
          check_results,
          verdict,
          verdict_confidence,
        ]
      properties:
        trace_id:
          type: string
          format: uuid
        user_id:
          type: string
        session_id:
          type: string
          minLength: 1
          maxLength: 64
        route:
          type: array
          items:
            type: string
            enum: [guardrail, router, knowledge, support, escalation]
        intent:
          type: string
          enum: [product_knowledge, account_support, general_web, human_handoff, out_of_scope, refused]
        tools:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/PublicSource"
        retrieval_scores:
          type: array
          items:
            type: number
        outcome:
          type: string
          enum: [answered, refused, handoff]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        handoff:
          oneOf:
            - $ref: "#/components/schemas/Handoff"
            - type: "null"
        latency_ms:
          type: integer
          minimum: 0
        claimed_statements:
          type: array
          items:
            $ref: "#/components/schemas/ClaimedStatement"
        evidence:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SourceEvidence"
              - $ref: "#/components/schemas/ToolEvidence"
        check_results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        verdict:
          type: string
          enum: [hallucinated, verified, unverified]
        verdict_confidence:
          type: number
          minimum: 0
          maximum: 1
    ClaimedStatement:
      type: object
      additionalProperties: false
      required: [kind, text, citations, fields]
      properties:
        kind:
          type: string
          enum: [product, support]
        text:
          type: string
        citations:
          type: array
          items:
            type: string
        fields:
          type: array
          items:
            type: string
    SourceEvidence:
      type: object
      additionalProperties: false
      required: [kind, title, url, retriever, score]
      properties:
        kind:
          type: string
          enum: [retrieved_source]
        title:
          type: string
        url:
          type: string
        retriever:
          type: string
          enum: [bm25, chroma]
        score:
          type: number
    ToolEvidence:
      type: object
      additionalProperties: false
      required: [kind, tool, fields, matched]
      properties:
        kind:
          type: string
          enum: [tool_comparison]
        tool:
          type: string
        fields:
          type: array
          items:
            type: string
        matched:
          type: boolean
    CheckResult:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum: [anchor, tool_payload, structured_output]
        status:
          type: string
          enum: [pass, fail, not_applicable]
    CheckResponse:
      type: object
      additionalProperties: false
      required: [trace_id, verdict, verdict_confidence, check_results]
      properties:
        trace_id:
          type: string
          format: uuid
        verdict:
          type: string
          enum: [hallucinated, verified, unverified]
        verdict_confidence:
          type: number
          minimum: 0
          maximum: 1
        check_results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
    MetricsSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          requests,
          answered,
          refused,
          handoffs,
          verified,
          hallucinated,
          unverified,
          corpus_age_days,
          corpus_stale,
          alerts,
        ]
      properties:
        requests:
          type: integer
          minimum: 0
        answered:
          type: integer
          minimum: 0
        refused:
          type: integer
          minimum: 0
        handoffs:
          type: integer
          minimum: 0
        verified:
          type: integer
          minimum: 0
        hallucinated:
          type: integer
          minimum: 0
        unverified:
          type: integer
          minimum: 0
        corpus_age_days:
          type: integer
          minimum: 0
        corpus_stale:
          type: boolean
        alerts:
          type: array
          items:
            type: string
            enum: [corpus_stale, hallucinated_ratio, handoff_ratio]
    ErrorBody:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
